[project]
name = "seo-rag"
version = "0.1.0"
description = "RAG-powered SEO research and marketing analytics assistant on Databricks"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "requests>=2.31",
]

[project.scripts]
ingest-docs = "seo_rag.ingestion.docs_bronze:main"

[dependency-groups]
dev = [
    "databricks-connect>=18.3,<18.4",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
pythonpath = ["src"]
markers = ["integration: requires a Databricks workspace connection"]
